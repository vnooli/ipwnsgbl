services:
  api:
    build:
      context: ./API
    ports:
      - "8000:8000"
    env_file:
      - ./API/.env
    environment:
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/forecasts/status/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ui:
    build:
      context: ./UI
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - api
